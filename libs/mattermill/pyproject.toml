[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mattermill"
version = "0.27.0"
description = "Deterministic, seeded generation of realistic business/legal documents and financial records — with defect-delta hooks for verifiable-fault injection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "reportlab>=4.4,<5",
    "Pillow>=11,<12",
    "pypdfium2>=4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mattermill = ["data/fonts/*.ttf", "data/fonts/*.txt"]

[project.urls]
Repository = "https://github.com/jarredparrett/verismill-lean/tree/main/libs/mattermill"
