[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verismill"
version = "0.9.0"
description = "Persistent, human-interpretable experiments for hill climbing synthetic documents with blind evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The climber is stdlib-only on purpose: it is the part that has to still run
# in five years to re-verify a bus chain. Rendering deps live in mattermill.
dependencies = []

[project.scripts]
verismill = "verismill.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/jarredparrett/verismill-lean"
