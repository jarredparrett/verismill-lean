[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verismill"
version = "0.2.0"
description = "A hill climber for synthetic documents: blind judges, an atlas of tells, and a hash-chained record of every round."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# The climber is stdlib-only on purpose: it is the part that has to still run
# in five years to re-verify a bus chain. Rendering deps live in mattermill.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/jarredparrett/verismill-lean"
